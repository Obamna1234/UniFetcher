# On a version tag (v1.2.3), builds the Windows installer/portable zip and attaches them to the
# SAME GitHub Release that the Android release workflow creates for that tag — so one release
# carries every operating system. Dormant until a v* tag is pushed.
name: Release (Windows)
on:
  push:
    tags: ["v*"]
permissions:
  contents: write
env:
  PROJECT_NAME: Nickvision.Parabolic.WinUI
jobs:
  windows:
    name: "Windows installer -> release"
    runs-on: windows-2025-vs2026
    defaults:
      run:
        working-directory: windows
    env:
      GH_TOKEN: ${{ github.token }}
      AMO_JWT_ISSUER: ${{ secrets.AMO_JWT_ISSUER }}
      AMO_JWT_SECRET: ${{ secrets.AMO_JWT_SECRET }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e  # v2
        id: msys2
        with:
          msystem: mingw64
          install: mingw-w64-x86_64-gettext-tools
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1  # v5
        with:
          dotnet-version: '10.0.x'
      - name: "Set up tools"
        shell: pwsh
        run: echo "${{ steps.msys2.outputs.msys2-location }}\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: "Build app"
        shell: pwsh
        run: |
          $ver = "${{ github.ref_name }}".TrimStart('v')
          $vsInstallPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -property installationPath
          Import-Module "$vsInstallPath\Common7\Tools\Microsoft.VisualStudio.DevShell.dll"
          Enter-VsDevShell -VsInstallPath $vsInstallPath -SkipAutomaticLocation
          dotnet restore ${{ env.PROJECT_NAME }} --runtime win-x64 /p:PublishReadyToRun=true
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet publish ${{ env.PROJECT_NAME }} -c Release --no-restore --runtime win-x64 /p:Platform=x64 /p:Version=$($ver.Split('-')[0]) /p:InformationalVersion=$ver
          if ($LASTEXITCODE -ne 0) { exit 1 }
          dotnet publish UniFetcher.NativeHost -c Release --runtime win-x64 -o "${{ env.PROJECT_NAME }}/bin/x64/Release/net10.0-windows10.0.19041.0/win-x64/publish"
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: "Package installer, portable zip and extensions"
        shell: pwsh
        run: scripts/package.ps1 -Arch x64 -Version "${{ github.ref_name }}".TrimStart('v') -ExtensionVersion 0.0.${{ github.run_number }} -PublishDir "${{ env.PROJECT_NAME }}/bin/x64/Release/net10.0-windows10.0.19041.0/win-x64/publish" -OutDir out
      - name: "Attach Windows files to the release for this tag"
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          # The Android release workflow creates the release; wait briefly for it to exist, then upload.
          for ($i = 0; $i -lt 20; $i++) {
            gh release view $tag 2>$null
            if ($LASTEXITCODE -eq 0) { break }
            Start-Sleep -Seconds 15
          }
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --title "UniFetcher $tag" --generate-notes
          }
          gh release upload $tag (Get-ChildItem out\* | ForEach-Object { $_.FullName }) --clobber
