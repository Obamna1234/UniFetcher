# Builds a test (debug) APK on every push and attaches it to the run as a download.
name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # GitHub's own cache only (the default "enhanced" mode uses an outside service)
          cache-provider: basic

      # Security: test builds run for every branch and pull request, so they never get the real
      # signing key (only release tags and main's smoke test do, through the "release" environment).
      # Test builds use a temporary debug key.
      - name: Build debug APKs and run unit tests
        run: |
          set -o pipefail
          ./gradlew assembleGenericDebug testGenericDebugUnitTest --stacktrace 2>&1 | tee build.log

      # If the build fails, show the compiler and test errors on the run's summary page.
      - name: Show build errors
        if: failure()
        run: |
          errors="$(grep -E '^e: |error:|FAILED|What went wrong|> Task .* FAILED|Exception' build.log | grep -v 'Exception: \s*$' | head -n 40 | cut -c1-300)"
          [ -z "$errors" ] && errors="$(tail -n 40 build.log | cut -c1-300)"
          errors="${errors//'%'/'%25'}"
          errors="${errors//$'\r'/}"
          errors="${errors//$'\n'/'%0A'}"
          echo "::error title=Build errors::$errors"

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/unifetch.jks"

      - name: Upload arm64 APK (most phones, including Samsung Galaxy A55)
        uses: actions/upload-artifact@v7
        with:
          # archive: false uploads the .apk itself (no zip), named after the file
          path: app/build/outputs/apk/generic/debug/*-arm64-v8a.apk
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload universal APK (any Android device)
        uses: actions/upload-artifact@v7
        with:
          # archive: false uploads the .apk itself (no zip), named after the file
          path: app/build/outputs/apk/generic/debug/*-universal.apk
          archive: false
          if-no-files-found: error
          retention-days: 14
