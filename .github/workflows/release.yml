# Builds signed release APKs when a version tag (e.g. v1.0.0) is pushed, and publishes them
# on the GitHub Releases page with automatically written release notes.
#
# Security: the signing secrets live in the "release" environment and this job only runs for
# version tags. The key is picked by choose-signing-key.sh (normally just UNIFETCH_NEW_*).
name: Release

on:
  push:
    tags: ["v*"]
  # Started on a version tag by the "Release request" workflow
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    environment: release
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          # GitHub's own cache only (the default "enhanced" mode uses an outside service)
          cache-provider: basic

      - name: Choose the signing key
        env:
          OLD_B64: ${{ secrets.UNIFETCH_KEYSTORE_BASE64 }}
          OLD_PW: ${{ secrets.UNIFETCH_KEYSTORE_PASSWORD }}
          OLD_ALIAS: ${{ secrets.UNIFETCH_KEY_ALIAS }}
          OLD_KPW: ${{ secrets.UNIFETCH_KEY_PASSWORD }}
          NEW_B64: ${{ secrets.UNIFETCH_NEW_KEYSTORE_BASE64 }}
          NEW_PW: ${{ secrets.UNIFETCH_NEW_KEYSTORE_PASSWORD }}
          NEW_ALIAS: ${{ secrets.UNIFETCH_NEW_KEY_ALIAS }}
          ROTATE_FROM_OLD_KEY: ${{ vars.ROTATE_FROM_OLD_KEY }}
        run: bash .github/scripts/choose-signing-key.sh required

      - name: Build signed release APKs
        env:
          # Only real releases take their version from the tag.
          APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
        run: ./gradlew assembleGenericRelease -PappVersion="$APP_VERSION" --stacktrace

      - name: Key rotation (only when both keys are set)
        if: env.ROTATE == '1'
        run: bash .github/scripts/sign-rotated.sh app/build/outputs/apk/generic/release

      - name: Remove signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/unifetch.jks" "$RUNNER_TEMP/unifetch-new.jks"

      - name: Check the APKs are signed
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"
          for apk in app/build/outputs/apk/generic/release/*.apk; do
            "$apksigner" verify "$apk"
            echo "Signed OK: $(basename "$apk")"
          done

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          # The in-app update check reads the version from this title.
          name: UniFetcher ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
          fail_on_unmatched_files: true
          files: |
            app/build/outputs/apk/generic/release/*-arm64-v8a.apk
            app/build/outputs/apk/generic/release/*-armeabi-v7a.apk
            app/build/outputs/apk/generic/release/*-x86_64.apk
            app/build/outputs/apk/generic/release/*-universal.apk
